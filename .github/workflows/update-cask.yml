name: Update Cask

on:
  workflow_dispatch:
  schedule:
    - cron: "23 7 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Update cask
        run: ruby scripts/update_cask.rb
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Commit update
        run: |
          if git diff --quiet; then
            echo "Cask already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/buzz.rb .github/brew-tap-publisher.json
          git commit -m "Update Buzz cask"
          git push
